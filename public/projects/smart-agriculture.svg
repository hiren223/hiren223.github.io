  <circle cx="1330" cy="600" r="90" fill="none" stroke="#E8E2D6" stroke-width="26" opacity="0.18"/>
  <path d="M1330 510 A90 90 0 0 1 1412 660" fill="none" stroke="#B4542A" stroke-width="26" stroke-linecap="round"/>
  <g font-family="'Archivo Narrow',Arial,sans-serif" fill="#E8E2D6">
    <text x="120" y="160" font-size="60" letter-spacing="8">SMART AGRICULTURE</text>
    <text x="124" y="212" font-size="30" letter-spacing="12" fill="#B4542A">ANALYTICS DASHBOARD</text>
  </g>
  <g font-family="'Archivo Narrow',Arial,sans-serif" fill="#B4542A" font-size="28" letter-spacing="6">
    <text x="120" y="890">POWER BI · SQL · PANDAS</text>
  </g>
</svg>
