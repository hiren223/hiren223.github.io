<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Smart Agriculture Analytics Dashboard — dashboard cover">
  <rect width="1600" height="1000" fill="#14100C"/>
  <!-- dashboard frame -->
  <rect x="120" y="300" width="1360" height="520" fill="none" stroke="#3A2E24" stroke-width="3"/>
  <path d="M120 400 H1480" stroke="#3A2E24" stroke-width="3"/>
  <g fill="#B4542A">
    <circle cx="160" cy="350" r="8"/><circle cx="192" cy="350" r="8" opacity="0.5"/><circle cx="224" cy="350" r="8" opacity="0.3"/>
  </g>
  <!-- bar panel -->
  <g fill="#E8E2D6" opacity="0.55">
    <rect x="180" y="640" width="46" height="120"/>
    <rect x="250" y="600" width="46" height="160"/>
    <rect x="320" y="660" width="46" height="100"/>
    <rect x="390" y="560" width="46" height="200"/>
